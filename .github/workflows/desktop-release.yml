name: Desktop release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_REPOSITORY: ${{ github.repository }}

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: llama-dashboard

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: llama-dashboard/package-lock.json

      - name: Install locked dependencies
        run: npm.cmd ci

      - name: Configure optional Windows signing
        env:
          CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CERTIFICATE_PFX_BASE64)) {
            Write-Warning "No Windows signing certificate is configured. Artifacts will be verified and published unsigned."
            exit 0
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP "llamabeg-windows-signing.pfx"
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:CERTIFICATE_PFX_BASE64))
          "WINDOWS_CERTIFICATE_FILE=$certificatePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Squirrel installer and update package
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: npm.cmd run make-installer

      - name: Build canonical portable ZIP
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: npm.cmd run release

      - name: Verify release artifacts
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag" -and -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_FILE)) {
            npm.cmd run verify-update-release -- --require-signed --tag $env:GITHUB_REF_NAME
          } elseif ($env:GITHUB_REF_TYPE -eq "tag") {
            npm.cmd run verify-update-release -- --tag $env:GITHUB_REF_NAME
          } else {
            npm.cmd run verify-update-release
          }

      - name: Retain verified CI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llama-score-dashboard-${{ github.ref_name }}-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 14
          path: |
            llama-dashboard/out/make/squirrel.windows/x64/Llama-Score-Dashboard-Setup.exe
            llama-dashboard/out/make/squirrel.windows/x64/LlamaScoreDashboard-*-full.nupkg
            llama-dashboard/out/make/squirrel.windows/x64/RELEASES
            llama-dashboard/release/Llama-Score-Dashboard-win32-x64.zip

      - name: Publish verified update release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $signatureDescription = if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_FILE)) {
            "Verified unsigned Windows installer"
          } else {
            "Verified signed Windows installer"
          }
          $assets = @(
            "out/make/squirrel.windows/x64/Llama-Score-Dashboard-Setup.exe",
            "out/make/squirrel.windows/x64/LlamaScoreDashboard-$((Get-Content package.json -Raw | ConvertFrom-Json).version)-full.nupkg",
            "out/make/squirrel.windows/x64/RELEASES",
            "release/Llama-Score-Dashboard-win32-x64.zip"
          )
          gh release create $env:GITHUB_REF_NAME @assets `
            --repo $env:RELEASE_REPOSITORY `
            --verify-tag `
            --title "Llama Score Dashboard $env:GITHUB_REF_NAME" `
            --notes "$signatureDescription, Squirrel update package, and portable fallback for $env:GITHUB_REF_NAME." `
            --latest
