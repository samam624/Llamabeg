[build]
  command = "node scripts/build-netlify-site.js"
  publish = "dist"
  # Holds the scheduled Supabase keep-alive (netlify/functions/supabase-keepalive.mjs).
  # This is Netlify's default location, but declare it so the keep-alive can't
  # silently stop being deployed if the default ever changes.
  functions = "netlify/functions"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-store"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; worker-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://eu5.paradoxwikis.com; connect-src 'self' https://*.supabase.co; base-uri 'none'; frame-ancestors 'none'; object-src 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/map_data/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
